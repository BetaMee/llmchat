# Unsloth + Qwen3-VL-32B 训练配置

# 模型配置
model:
  name: "Qwen/Qwen3-VL-32B-Instruct"  # Qwen3-VL-32B 多模态模型
  max_seq_length: 4096  # 增加序列长度以支持复杂的 Figma JSON
  dtype: null  # auto detection
  load_in_4bit: true  # 使用 4-bit 量化

# LoRA 配置
lora:
  r: 32  # 增加 LoRA rank 以适应更大模型
  lora_alpha: 32
  lora_dropout: 0
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"
  random_state: 42
  use_rslora: false
  loftq_config: null

# 训练配置
training:
  output_dir: "./outputs"
  num_train_epochs: 3
  per_device_train_batch_size: 1  # 减小batch size适应32B模型
  gradient_accumulation_steps: 8  # 增加梯度累积
  warmup_steps: 10
  learning_rate: 1.0e-4  # 降低学习率
  fp16: false
  bf16: true  # 使用 bf16 以提升训练速度
  logging_steps: 10
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  seed: 42
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  report_to: "tensorboard"  # 或 "wandb"

# 数据配置
data:
  train_file: "./data/train.json"
  val_file: "./data/val.json"
  max_length: 4096

# 推理配置
inference:
  max_new_tokens: 2048  # 增加以支持长 JSON 输出
  temperature: 0.1  # 降低温度以获得更确定的输出
  top_p: 0.9
  do_sample: true
